<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <script>
            // 应用基础路径：兼容被外层网关挂到子路径下（如沙箱 /view/<会话id>/<端口>/）。
            // 只提取稳定的沙箱挂载前缀，不依赖尾斜杠或页面路由层级；非沙箱环境回退到根路径。
            const sandboxPathMatch = location.pathname.match(/^\/view\/[^/]+\/\d+(?=\/|$)/);
            window.__APP_BASE__ = sandboxPathMatch ? `${sandboxPathMatch[0]}/` : '/';
        </script>
    </head>
    <body>
        <div id="app"></div>
    </body>
</html>
